name: Community CI

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t forgeflow-community:test .
      - name: Start container
        run: docker run -d --name forgeflow-community -p 8000:8000 forgeflow-community:test
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert r.status == 200"; then
              exit 0
            fi
            sleep 2
          done
          docker logs forgeflow-community
          exit 1
